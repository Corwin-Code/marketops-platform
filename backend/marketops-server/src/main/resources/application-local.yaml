# Workstation profile.
#
# Activated by `make backend-run`. It only names the environment and raises the
# detail of this project's own log records; connection settings stay in the base
# file so a workstation and continuous integration exercise the same wiring.

marketops:
  environment: local
  metadata-maintenance:
    # The workstation is the operator's maintenance seat: the process binds to
    # loopback and mutations carry operator attribution, so writes are accepted.
    write-enabled: true
  web:
    cors:
      allowed-origins: http://127.0.0.1:5173,http://127.0.0.1:4173
  # The workstation runs the Ozon pilot, whose Owner consented to scheduled read-only
  # collection (2026-09-29): the timer runs here, and a store is collected only once
  # its Owner puts scheduled collection in force in the console.
  data-collection:
    enabled: ${MARKETOPS_DATA_COLLECTION_ENABLED:true}
  # The Owner authorized the platform's write capabilities on 2026-10-01: the workstation
  # may turn write switches on. Nothing is written by this alone; every price write still
  # needs a verified capability, the switches, the allowlist, an approval and the gate.
  production-writes:
    enabled: ${MARKETOPS_PRODUCTION_WRITES_ENABLED:true}
  # W1 (the same authorization): this workstation is the process that executes approved price
  # commands. The worker only tries; a command whose write gate is shut stays where it is.
  price-write:
    worker-enabled: ${MARKETOPS_PRICE_WRITE_WORKER_ENABLED:true}
  # Secrets are read from a directory outside the repository. The model key
  # lives at <mount>/ai/dashscope-api-key; `make ai-provider` installs it.
  secrets:
    mount-directory: ${MARKETOPS_SECRET_MOUNT_DIRECTORY:${user.home}/.marketops-platform/secrets}
    # macOS has no descriptor-relative directory walk; the workstation reads the
    # mount by path instead, and only from owner-only directories.
    workstation-fallback: true
  # The one model provider the workstation may reach: Alibaba Cloud Model
  # Studio's OpenAI-compatible chat endpoint. The host is the operator's own
  # workspace domain (MARKETOPS_AI_DASHSCOPE_HOST in .env.local); the shared
  # Beijing domain is the fallback. The provider and its model still have to be
  # registered before anything is called (`make ai-provider`).
  outbound:
    destinations:
      - key: ai:dashscope
        host: ${MARKETOPS_AI_DASHSCOPE_HOST:dashscope.aliyuncs.com}
        path-prefix: /compatible-mode/v1/chat/completions
        methods: [POST]
        headers: [content-type, accept, authorization]
        max-request-bytes: 262144
        max-response-bytes: 131072
        timeout-millis: 60000
      # Ozon Seller API reads for the pilot account. The transport needs exactly
      # one matching rule per call, so every read path gets its own rule under
      # this key and prefixes never overlap. Facts from the official Seller API
      # documentation (https://docs.ozon.ru/api/seller/, checked 2026-09-28): host
      # api-seller.ozon.ru, POST with JSON bodies, Client-Id and Api-Key headers.
      # Only the key's connectivity check is open so far; a read path is added
      # here when its registry endpoint is verified against the real account.
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v1/roles
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Catalog: product attributes, names and barcodes, paged with last_id
      # (official OpenAPI, POST /v4/product/info/attributes, limit ≤ 1000).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v4/product/info/attributes
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Prices, paged with cursor (official OpenAPI, POST /v5/product/info/prices).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v5/product/info/prices
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Product status and availability for batches of recorded product ids
      # (official OpenAPI, POST /v3/product/info/list, up to 1000 ids per request).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v3/product/info/list
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Content rating for batches of recorded SKUs (official OpenAPI,
      # POST /v1/product/rating-by-sku).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v1/product/rating-by-sku
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Analytics by SKU for one UTC day per run, paged by computed offset
      # (official OpenAPI, POST /v1/analytics/data; at most 1 request per minute).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v1/analytics/data
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Search demand per SKU and the search terms behind it, for one seven-day
      # window (official OpenAPI, POST /v1/analytics/product-queries and
      # POST /v1/analytics/product-queries/details, up to 1000 SKUs per request).
      # One rule covers both: a second rule for /details would overlap this
      # prefix, and a call matching two rules is refused.
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v1/analytics/product-queries
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 32768
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Promotions (official OpenAPI checked 2026-09-29, "Actions read-only" role):
      # the actions open to the store (GET /v1/actions) and, one action per
      # request, the products that can join and the ones taking part
      # (POST /v2/actions/candidates, POST /v2/actions/products). Exact paths:
      # write methods live beneath them (/v1/actions/products/activate,
      # /v2/actions/products/deactivate and more), and a prefix would match those.
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v1/actions
        exact-path: true
        methods: [GET]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v2/actions/candidates
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v2/actions/products
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # The store's standing (official OpenAPI 2026-10-01): its rating summary
      # (POST /v1/rating/summary) and its FBS/rFBS warehouses (POST
      # /v2/warehouse/list). Exact paths: /v2/warehouse/list sits beside write
      # methods such as /v1/warehouse/archive, and a prefix never widens a read.
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v1/rating/summary
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v2/warehouse/list
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Buyers' discount requests (official OpenAPI 2026-10-01, POST
      # /v2/actions/discounts-task/list, pages of 50 after the last request's
      # id). Exact path: approving and declining are write methods beside it
      # (/v1/actions/discounts-task/approve, /v1/actions/discounts-task/decline).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v2/actions/discounts-task/list
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Stock per warehouse type, paged with cursor (official OpenAPI,
      # POST /v4/product/info/stocks, limit 1–1000).
      - key: platform:OZON:read
        host: api-seller.ozon.ru
        path-prefix: /v4/product/info/stocks
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      # Price writes (W1, Owner authorization 2026-10-01; official OpenAPI 2026-10-01): the
      # apply (POST /v1/product/import/prices, one product per request) and its readback
      # (POST /v5/product/info/prices filtered to that product). Every call of a price
      # command, readbacks included, leaves under this key and nothing else does. Exact
      # paths: a write rule never covers a neighbouring method.
      - key: platform:OZON:write
        host: api-seller.ozon.ru
        path-prefix: /v1/product/import/prices
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000
      - key: platform:OZON:write
        host: api-seller.ozon.ru
        path-prefix: /v5/product/info/prices
        exact-path: true
        methods: [POST]
        headers: [accept, content-type, client-id, api-key]
        max-request-bytes: 16384
        max-response-bytes: 8388608
        timeout-millis: 30000

logging:
  pattern:
    # Workstation output is one readable line and includes every safe identity
    # and event field needed to correlate it with non-local JSON records.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level application=${spring.application.name} environment=${marketops.environment} buildVersion=${spring.application.version} correlationId=%X{correlationId:-none} %logger{36} - %msg %kvp%n"
  level:
    com.mimococo.marketops: DEBUG

spring:
  flyway:
    # A workstation database is created by the compose stack and is expected to be
    # empty. Migrating into a non-empty database is an error worth failing on.
    baseline-on-migrate: false
