# Base configuration shared by every environment.
#
# Values that differ between workstations live in the ignored local file the
# generator writes; this file references them by name so a missing value fails
# startup with the name of what is missing rather than silently defaulting.
#
# Database role names are checked in here on purpose. They are identical in every
# environment and are not secrets, so keeping them in one authoritative place
# removes the class of failure where a workstation and continuous integration
# disagree about who owns a schema.

spring:
  application:
    name: marketops-server
    version: "@project.version@"
  # An empty profile list would activate "default" and load any file named after
  # it. Naming a profile that owns no file makes an unprofiled start explicit.
  profiles:
    default: none
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://127.0.0.1:${MARKETOPS_DB_PORT:5432}/marketops
    username: marketops_app
    password: ${MARKETOPS_DB_APP_PASSWORD}
    hikari:
      pool-name: marketops-app-pool
      maximum-pool-size: 10
      minimum-idle: 2
      # The console abandons a metadata request after five seconds. Keep the
      # pool's acquisition and validation windows inside that observable bound
      # so a database outage can be returned as DOWN instead of looking like an
      # unreachable backend.
      connection-timeout: 1000
      validation-timeout: 750
      # The application role owns nothing and creates nothing, so a connection
      # that is handed back must not carry a transaction the next borrower joins.
      auto-commit: true
  flyway:
    enabled: true
    # Migration runs as the owning role, which is the only role allowed to create
    # a schema. Supplying credentials here makes Spring derive a separate data
    # source, so the application pool never holds the elevated identity.
    user: marketops_migration
    password: ${MARKETOPS_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # Nothing in this project may drop a schema. Disabling clean removes the
    # command rather than relying on nobody typing it.
    clean-disabled: true
    out-of-order: false
  jackson:
    default-property-inclusion: always
    deserialization:
      # The maintenance API is the only surface that reads request bodies. An
      # unknown field there is either a typo or an attempt to smuggle a value
      # into a model, and both must fail rather than be silently dropped.
      fail-on-unknown-properties: true

server:
  # Loopback only. The process has no authentication, so neither the metadata
  # resource nor the maintenance surface may be reachable from another host.
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

marketops:
  product: MarketOps Russia
  object-storage:
    # Immutable Raw custody. The workstation and continuous integration keep
    # evidence in a local content-addressed directory; a managed environment
    # selects the object store and names its bucket, region and credential
    # reference. Both providers are write-once and read-back verified.
    provider: FILESYSTEM
    root-directory: ${MARKETOPS_RAW_CUSTODY_DIRECTORY:./local-data/raw-custody}
  acquisition:
    # Off. A worker that started itself wherever the application happened to run
    # would reach marketplaces from a workstation and from a test container, so
    # an environment that wants acquisition has to say so.
    scheduler-enabled: false
    lease-duration: 5m
    maximum-calls-per-run: 20
    retry-budget: 3
    retry-delay: 2m
    runs-per-scheduler-pass: 5

  price-write:
    # Off, and for a stronger reason than acquisition: a worker that started
    # itself would change real marketplace prices from a workstation and from a
    # test container. Turning it on does not enable writes — every command still
    # passes the write gate — it only decides whether this process is one of the
    # ones that tries.
    worker-enabled: false
    commands-per-pass: 5
    retry-budget: 3
  # The directory the platform's secret manager delivers values into. Absent by
  # default: with no mount, every secret reference is unresolvable and every
  # operation that would need one refuses.
  secrets: {}
  identity:
    oidc:
      # Absent by default. Without an issuer no token can be validated, so the
      # console API denies every request; a serving environment is required to
      # configure one and fails startup otherwise.
      session-recording-interval: 5m
  analytics:
    # Domain-specific freshness targets. A metric whose freshest contributing
    # fact is older than its domain allows is downgraded to STALE, which the
    # write gate reads and refuses.
    funnel-freshness: 48h
    sales-freshness: 24h
    returns-freshness: 48h
    inventory-freshness: 6h
    advertising-freshness: 24h
    cost-freshness: 7d
    thresholds:
      # Operating configuration the deterministic rules compare against. Every
      # triggered finding records the value and the threshold it compared, so a
      # number somebody disputes can be argued about with both in view.
      minimum-data-completeness: 0.80
      low-impression-floor: 100
      low-click-through-rate: 0.0100
      low-click-through-minimum-impressions: 500
      low-conversion-rate: 0.0100
      low-conversion-minimum-reach: 200
      high-return-rate: 0.2000
      high-return-minimum-units: 10
      stock-cover-days-floor: 7
      advertising-cost-of-sale-ceiling: 0.3000
  metadata-maintenance:
    # Fail closed: an environment accepts maintenance writes only when its
    # profile explicitly turns them on. Queries are not gated.
    write-enabled: false
  production-writes:
    # Globally disabled. The binding contract rejects true at startup, so no
    # environment and no metadata flag can represent enabled production writes.
    enabled: false

management:
  # Nothing is reachable unless it is named below.
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      # Component names and aggregate status are operationally useful. Detailed
      # messages remain hidden because they can name pools, queries and hosts.
      show-details: never
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          # Readiness includes the datasource: an instance that cannot reach its
          # database must not be sent traffic.
          include: readinessState,db
        liveness:
          # Liveness deliberately excludes the datasource. A database outage is
          # not a reason to restart a healthy process.
          include: livenessState
    info:
      access: read-only
  info:
    build:
      enabled: true
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
    process:
      enabled: false

logging:
  # Request records carry their established identifier; records outside a
  # request use the profile's explicit no-request representation.
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    com.mimococo.marketops: INFO
    # Normal driver/pool/migration INFO records include JDBC locations, ports,
    # pool names or role-adjacent configuration. The allowlisted metadata and
    # fixed application events provide status without publishing those values.
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
    org.postgresql: WARN
