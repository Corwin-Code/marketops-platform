name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C.UTF-8
  # CI publishes explicit security and supply-chain results, so npm's optional
  # funding and inline audit network calls add noise without owning a Gate.
  npm_config_fund: 'false'
  npm_config_audit: 'false'

defaults:
  run:
    working-directory: frontend/marketops-console

jobs:
  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/marketops-console/.node-version
          cache: npm
          cache-dependency-path: frontend/marketops-console/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  frontend-typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/marketops-console/.node-version
          cache: npm
          cache-dependency-path: frontend/marketops-console/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Type-check
        run: npm run typecheck

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/marketops-console/.node-version
          cache: npm
          cache-dependency-path: frontend/marketops-console/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/marketops-server/pom.xml
      - name: Install from the lockfile
        run: npm ci
      - name: Run the tests with coverage
        run: npm run test:ci
      - name: Prove the frontend coverage gate rejects an unmet threshold
        working-directory: .
        run: bash scripts/verify_coverage_thresholds.sh frontend
      - name: Install the Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Generate isolated local configuration
        working-directory: .
        run: make env-init
      - name: Start PostgreSQL
        working-directory: .
        run: make up
      - name: Exercise authenticated business flow and dependency recovery in Chromium
        run: npm run test:browser
        env:
          MARKETOPS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Stop the isolated database
        if: always()
        working-directory: .
        run: |
          if [ -f .env.local ]; then
            docker compose --project-name marketops-local \
              --env-file .env.local \
              -f infra/compose/docker-compose.yml \
              down --volumes --remove-orphans
          fi
      - name: Exercise governed advertising roles in a fresh isolated database
        working-directory: .
        run: bash scripts/validation/advertising_browser_isolated.sh
        env:
          MARKETOPS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish advertising browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: advertising-browser-screenshots
          if-no-files-found: warn
          retention-days: 14
          path: frontend/marketops-console/test-results/advertising/**/*.png
      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          if-no-files-found: warn
          retention-days: 14
          path: frontend/marketops-console/coverage/

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/marketops-console/.node-version
          cache: npm
          cache-dependency-path: frontend/marketops-console/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Prove that only prefixed values reached the bundle
        # The canary rebuilds with withheld values in the environment and
        # searches the output for them, which is the only way to observe a
        # broadened prefix before someone opens the published file.
        run: npm run verify:bundle
      - name: Build the console
        # Replace the canary distribution with the authored-commit build that
        # will be uploaded. The canary's public test settings are not release metadata.
        run: npm run build
        env:
          MARKETOPS_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_MARKETOPS_API_BASE_URL: http://127.0.0.1:8080
          VITE_MARKETOPS_ENVIRONMENT: ci
      - name: Produce the CycloneDX and dependency inventories
        run: |
          npm run sbom
          npm ls --all --json > npm-dependency-inventory.json
      - name: Publish the console and its inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-distribution
          if-no-files-found: error
          retention-days: 30
          path: |
            frontend/marketops-console/dist/
            frontend/marketops-console/npm-dependency-inventory.json
            build/supply-chain/frontend-sbom.json
