name: Implementation Tranche / Work Package
description: Create a bounded engineering unit under an approved Production Delivery Slice
title: "[WP-] "
body:
  - type: input
    id: wp_id
    attributes:
      label: Work Package / Tranche ID
      placeholder: WP-S1-001A
    validations:
      required: true
  - type: input
    id: slice_id
    attributes:
      label: Parent Delivery Slice
      placeholder: SLICE-V1-001
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Parent Acceptance IDs advanced
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Coherent engineering outcome
      description: State what this tranche leaves implemented and verifiable.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope and explicit non-goals
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence and checks
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks, dependencies and Conditional Gate triggers
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This tranche does not redefine the parent Slice Product Acceptance Contract.
          required: true
        - label: No Secret, Credential, Buyer PII or unredacted production data is included.
          required: true
        - label: Merge does not itself enable production Marketplace writes.
          required: true
