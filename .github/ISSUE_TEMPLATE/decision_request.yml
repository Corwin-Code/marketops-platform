name: Decision Request
description: Resolve a material Owner, product, architecture, authority, provider or irreversible decision
title: "[DR-] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem, evidence and trigger
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current contract / decision / source of truth
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision and alternatives
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Product, requirements, modules, data/migration, security, compatibility and operations impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Tests/evidence, rollout, rollback and stop conditions
    validations:
      required: true
  - type: dropdown
    id: authority
    attributes:
      label: Decision authority
      options:
        - Human Owner
        - GPT Controller / Architecture
        - Joint Owner + Controller
        - Owner + Legal/Security
    validations:
      required: true
